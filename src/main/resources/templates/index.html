<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>My Frontend Project</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
</head>
<body>
<div class="container my-4">
    <div class="row align-items-center mb-4">
        <div class="col-auto" style="width: 150px">
            <img
                    class="img-fluid"
                    src="/templates/lib/profile-svgrepo-com.png"
                    alt="Profile"
            />
        </div>
        <div class="col">
            <h2 class="text-primary mb-0">Aplikasi Data Pribadi</h2>
        </div>
    </div>
    <form
            id="searchForm"
            class="d-flex justify-content-between align-items-end p-4 rounded"
            style="background-color: #f8d7da"
    >
        <div class="d-flex flex-column gap-2" style="min-width: 500px">
            <label for="nik" class="form-label fw-bold mb-0">NIK</label>
            <input
                    type="text"
                    class="form-control"
                    id="nik"
                    placeholder="Masukkan NIK"
            />

            <label for="nama" class="form-label fw-bold mb-0 mt-4">Nama</label>
            <input
                    type="text"
                    class="form-control"
                    id="nama"
                    placeholder="Masukkan Nama"
            />
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary btn-lg px-4">
                Search
            </button>
            <button type="button" class="btn btn-success btn-lg px-4" id="btnAdd">
                Add
            </button>
        </div>
    </form>

    <!-- Modal create data -->
    <div
            class="modal fade"
            id="addModal"
            tabindex="-1"
            aria-labelledby="addModalLabel"
            aria-hidden="true"
    >
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="addForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="addModalLabel">Tambah Data Baru</h5>
                        <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="modal"
                        ></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="addNik" class="form-label">NIK</label>
                            <input
                                    type="text"
                                    class="form-control"
                                    id="addNik"
                                    required
                            />
                        </div>
                        <div class="mb-3">
                            <label for="addName" class="form-label">Nama Lengkap</label>
                            <input
                                    type="text"
                                    class="form-control"
                                    id="addName"
                                    required
                            />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Jenis Kelamin</label>
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input
                                            class="form-check-input"
                                            type="radio"
                                            name="addGender"
                                            id="genderMale"
                                            value="Laki-laki"
                                            required
                                    />
                                    <label class="form-check-label" for="genderMale"
                                    >Laki-laki</label
                                    >
                                </div>
                                <div class="form-check">
                                    <input
                                            class="form-check-input"
                                            type="radio"
                                            name="addGender"
                                            id="genderFemale"
                                            value="Perempuan"
                                            required
                                    />
                                    <label class="form-check-label" for="genderFemale"
                                    >Perempuan</label
                                    >
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="addBirthDate" class="form-label"
                            >Tanggal Lahir</label
                            >
                            <input
                                    type="date"
                                    class="form-control"
                                    id="addBirthDate"
                                    required
                            />
                        </div>
                        <div class="mb-3">
                            <label for="addAddress" class="form-label">Alamat</label>
                            <textarea
                                    class="form-control"
                                    id="addAddress"
                                    rows="3"
                                    required
                            ></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="addCountry" class="form-label">Negara</label>
                            <select class="form-select" id="addCountry" required>
                                <option value="">Pilih Negara</option>
                                <option value="Australia">Australia</option>
                                <option value="Austria">Austria</option>
                                <option value="Belgium">Belgium</option>
                                <option value="Brazil">Brazil</option>
                                <option value="Canada">Canada</option>
                                <option value="China">China</option>
                                <option value="Denmark">Denmark</option>
                                <option value="Egypt">Egypt</option>
                                <option value="Finland">Finland</option>
                                <option value="France">France</option>
                                <option value="Germany">Germany</option>
                                <option value="India">India</option>
                                <option value="Indonesia">Indonesia</option>
                                <option value="Italy">Italy</option>
                                <option value="Japan">Japan</option>
                                <option value="Malaysia">Malaysia</option>
                                <option value="Mexico">Mexico</option>
                                <option value="Netherlands">Netherlands</option>
                                <option value="New Zealand">New Zealand</option>
                                <option value="Philippines">Philippines</option>
                                <option value="Singapore">Singapore</option>
                                <option value="South Africa">South Africa</option>
                                <option value="South Korea">South Korea</option>
                                <option value="Spain">Spain</option>
                                <option value="Sweden">Sweden</option>
                                <option value="Switzerland">Switzerland</option>
                                <option value="Thailand">Thailand</option>
                                <option value="United Kingdom">United Kingdom</option>
                                <option value="United States">United States</option>
                                <option value="Vietnam">Vietnam</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                                type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal"
                        >
                            Batal
                        </button>
                        <button type="submit" class="btn btn-success">Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal detail -->
    <div
            class="modal fade"
            id="detailModal"
            tabindex="-1"
            aria-labelledby="detailModalLabel"
            aria-hidden="true"
    >
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="detailForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="detailModalLabel">
                            Detail Data Pribadi
                        </h5>
                        <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="modal"
                        ></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="detailNik" class="form-label">NIK</label>
                            <input
                                    type="text"
                                    class="form-control"
                                    id="detailNik"
                                    readonly
                                    disabled
                            />
                        </div>
                        <div class="mb-3">
                            <label for="detailName" class="form-label">Nama</label>
                            <input
                                    type="text"
                                    class="form-control"
                                    id="detailName"
                                    readonly
                                    disabled
                            />
                        </div>
                        <div class="mb-3">
                            <label for="detailBirthDate" class="form-label"
                            >Tanggal Lahir</label
                            >
                            <input
                                    type="date"
                                    class="form-control"
                                    id="detailBirthDate"
                                    readonly
                                    disabled
                            />
                        </div>
                        <div class="mb-3">
                            <label class="form-label d-block">Jenis Kelamin</label>
                            <div class="d-flex gap-4">
                                <div class="form-check">
                                    <input
                                            class="form-check-input"
                                            type="radio"
                                            name="detailGender"
                                            id="detailMale"
                                            value="Male"
                                            disabled
                                    />
                                    <label class="form-check-label" for="detailMale">
                                        Laki-laki
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input
                                            class="form-check-input"
                                            type="radio"
                                            name="detailGender"
                                            id="detailFemale"
                                            value="Female"
                                            disabled
                                    />
                                    <label class="form-check-label" for="detailFemale">
                                        Perempuan
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="detailAddress" class="form-label">Alamat</label>
                            <textarea
                                    class="form-control"
                                    id="detailAddress"
                                    rows="2"
                                    readonly
                                    disabled
                            ></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="detailCountry" class="form-label">Negara</label>
                            <input
                                    type="text"
                                    class="form-control"
                                    id="detailCountry"
                                    readonly
                                    disabled
                            />
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                                type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal"
                        >
                            Tutup
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal detele -->
    <div
            class="modal fade"
            id="deleteModal"
            tabindex="-1"
            aria-labelledby="deleteModalLabel"
            aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body">
                    <h6>
                        Apakah Anda yakin ingin menghapus data
                        <span id="deleteName"></span>?
                    </h6>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="confirmDelete">
                        OK
                    </button>
                    <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                    >
                        Batal
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Edit -->
    <div
            class="modal fade"
            id="editModal"
            tabindex="-1"
            aria-labelledby="editModalLabel"
            aria-hidden="true"
    >
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="editForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editModalLabel">
                            Edit Data Pribadi
                        </h5>
                        <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="modal"
                        ></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="editNik" class="form-label">NIK</label>
                            <input
                                    type="text"
                                    class="form-control"
                                    id="editNik"
                                    readonly
                                    disabled
                            />
                        </div>
                        <div class="mb-3">
                            <label for="editName" class="form-label">Nama</label>
                            <input
                                    type="text"
                                    class="form-control"
                                    id="editName"
                                    required
                            />
                        </div>
                        <div class="mb-3">
                            <label for="editBirthDate" class="form-label"
                            >Tanggal Lahir</label
                            >
                            <input
                                    type="date"
                                    class="form-control"
                                    id="editBirthDate"
                                    required
                            />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Jenis Kelamin</label>
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input
                                            class="form-check-input"
                                            type="radio"
                                            name="editGender"
                                            id="editMale"
                                            value="Laki-laki"
                                            required
                                    />
                                    <label class="form-check-label" for="editMale"
                                    >Laki-laki</label
                                    >
                                </div>
                                <div class="form-check">
                                    <input
                                            class="form-check-input"
                                            type="radio"
                                            name="editGender"
                                            id="editFemale"
                                            value="Perempuan"
                                            required
                                    />
                                    <label class="form-check-label" for="editFemale"
                                    >Perempuan</label
                                    >
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="editAddress" class="form-label">Alamat</label>
                            <textarea
                                    class="form-control"
                                    id="editAddress"
                                    rows="2"
                                    required
                            ></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="editCountry" class="form-label">Negara</label>
                            <select class="form-select" id="editCountry" required>
                                <option value="">Pilih Negara</option>
                                <option value="Australia">Australia</option>
                                <option value="Austria">Austria</option>
                                <option value="Belgium">Belgium</option>
                                <option value="Brazil">Brazil</option>
                                <option value="Canada">Canada</option>
                                <option value="China">China</option>
                                <option value="Denmark">Denmark</option>
                                <option value="Egypt">Egypt</option>
                                <option value="Finland">Finland</option>
                                <option value="France">France</option>
                                <option value="Germany">Germany</option>
                                <option value="India">India</option>
                                <option value="Indonesia">Indonesia</option>
                                <option value="Italy">Italy</option>
                                <option value="Japan">Japan</option>
                                <option value="Malaysia">Malaysia</option>
                                <option value="Mexico">Mexico</option>
                                <option value="Netherlands">Netherlands</option>
                                <option value="New Zealand">New Zealand</option>
                                <option value="Philippines">Philippines</option>
                                <option value="Singapore">Singapore</option>
                                <option value="South Africa">South Africa</option>
                                <option value="South Korea">South Korea</option>
                                <option value="Spain">Spain</option>
                                <option value="Sweden">Sweden</option>
                                <option value="Switzerland">Switzerland</option>
                                <option value="Thailand">Thailand</option>
                                <option value="United Kingdom">United Kingdom</option>
                                <option value="United States">United States</option>
                                <option value="Vietnam">Vietnam</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                                type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal"
                        >
                            Batal
                        </button>
                        <button type="submit" class="btn btn-warning">Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Tabel -->
    <div class="card mt-4">
        <div class="card-header bg-secondary text-white">Daftar Data</div>
        <div class="card-body">
            <table class="table table-striped" id="dataTable">
                <thead>
                <tr>
                    <th>No</th>
                    <th>NIK</th>
                    <th>Nama Lengkap</th>
                    <th>Umur</th>
                    <th>Tanggal Lahir</th>
                    <th>Jenis Kelamin</th>
                    <th>Alamat</th>
                    <th>Negara</th>
                    <th>Aksi</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- fetching data -->
<script src="js/fetching.js"></script>

<!-- create data -->
<script src="/templates/js/create.js"></script>

<!-- edit data -->
<script src="/templates/js/edit.js"></script>

<!-- delete data -->
<script src="/templates/js/delete.js"></script>

</body>
</html>
